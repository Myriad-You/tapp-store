name: PR Check

on:
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

jobs:
  catalog:
    name: Catalog & package check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce PR scope (no index.json; one app max)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-pr-scope.mjs

      - name: Validate packages (manifest → download map)
        run: node scripts/sync-index.mjs validate

      - name: Alignment report (informational)
        run: |
          set +e
          node scripts/sync-index.mjs report
          # Drift is expected on app PRs; main bot will sync. Do not fail here.
          exit 0

      - name: Validate static previews
        run: node scripts/validate-previews.mjs
