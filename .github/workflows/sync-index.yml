name: Catalog Sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/sync-index.mjs'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Align index.json from manifests
    runs-on: ubuntu-latest
    # Avoid infinite loop: bot commits should not re-trigger meaningful work,
    # but path filter + [skip ci] keep it quiet.
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need a token that can push back to main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync catalog from manifests
        run: node scripts/sync-index.mjs sync --prune

      - name: Validate previews against new index
        run: node scripts/validate-previews.mjs

      - name: Commit index.json if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json; then
            echo 'index.json already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m "$(cat <<'EOF'
          chore(catalog): auto-align index.json from manifests

          Generated by scripts/sync-index.mjs. Do not hand-edit index.json.
          EOF
          )"
          git push
