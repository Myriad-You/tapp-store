name: Catalog Sync

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/sync-index.mjs'
      - 'scripts/validate-app.mjs'
      - 'scripts/validate-previews.mjs'
      - 'index.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync-main
  cancel-in-progress: false

jobs:
  sync:
    name: Align index.json from manifests
    runs-on: ubuntu-latest
    # GITHUB_TOKEN pushes normally do not re-trigger workflows; keep a guard anyway.
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sync catalog from manifests (+ catalog.json)
        run: node scripts/sync-index.mjs sync --prune

      - name: Validate all apps
        run: node scripts/validate-app.mjs --all

      - name: Validate previews (index + disk orphans)
        run: node scripts/validate-previews.mjs --disk

      - name: Commit index.json if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json; then
            echo 'index.json already aligned.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m "$(cat <<'EOF'
          chore(catalog): auto-align index.json from manifests

          Generated by scripts/sync-index.mjs. Do not hand-edit index.json.
          EOF
          )"
          git push
