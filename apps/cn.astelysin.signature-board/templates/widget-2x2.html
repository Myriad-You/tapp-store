<section class="signature-widget signature-widget--square" data-widget-root data-size="2x2" data-theme="light" aria-label="共享签名板预览">
  <header class="signature-widget__header">
    <span class="signature-widget__mark" aria-hidden="true">共</span>
    <span class="signature-widget__title"><strong data-widget-title>共享签名板</strong><small data-widget-status>等待快照</small></span>
    <span class="signature-widget__live"><i></i><span data-widget-live>共享</span></span>
  </header>
  <figure class="signature-widget__canvas">
    <img data-widget-image alt="最近发布的共享签名板快照" hidden>
    <span class="signature-widget__empty" data-widget-empty><b>✦</b><span data-widget-empty-copy>还没有公开快照</span></span>
  </figure>
  <footer class="signature-widget__footer">
    <span><small data-widget-drawings-label>作品</small><strong data-widget-drawings>—</strong></span>
    <span><small data-widget-archives-label>归档</small><strong data-widget-archives>0</strong></span>
    <span class="signature-widget__updated" data-widget-updated>等待管理员发布</span>
  </footer>
</section>
