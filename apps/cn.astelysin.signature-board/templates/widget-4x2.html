<section class="signature-widget signature-widget--wide" data-widget-root data-size="4x2" data-theme="light" aria-label="共享签名板预览">
  <figure class="signature-widget__canvas">
    <img data-widget-image alt="最近发布的共享签名板快照" hidden>
    <span class="signature-widget__empty" data-widget-empty><b>✦</b><span data-widget-empty-copy>还没有公开快照</span></span>
    <span class="signature-widget__canvas-label" data-widget-canvas-size>4096 × 2304</span>
  </figure>
  <div class="signature-widget__summary">
    <header class="signature-widget__header">
      <span class="signature-widget__mark" aria-hidden="true">共</span>
      <span class="signature-widget__title"><strong data-widget-title>共享签名板</strong><small data-widget-status>等待快照</small></span>
    </header>
    <p class="signature-widget__intro" data-widget-intro>所有人的签名与画作，共同留在一块画布上。</p>
    <div class="signature-widget__stats">
      <span><small data-widget-drawings-label>公开作品</small><strong data-widget-drawings>—</strong></span>
      <span><small data-widget-occupancy-label>占用</small><strong data-widget-occupancy>—</strong></span>
      <span><small data-widget-archives-label>归档</small><strong data-widget-archives>0</strong></span>
    </div>
    <footer><span class="signature-widget__live"><i></i><span data-widget-live>共享中</span></span><span data-widget-updated>等待管理员发布</span></footer>
  </div>
</section>
