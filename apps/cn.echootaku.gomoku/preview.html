<div id="gomoku-background" aria-hidden="true"></div>
<main id="gomoku-content">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">五</span><div><h1>联邦五子棋</h1><p>落子相逢，跨站成局</p></div></div>
    <div class="identity"><span class="status-dot online"></span><span>@EchoOtaku@echootaku.cn</span></div>
  </header>
  <div class="game-layout">
    <section class="board-card">
      <div class="board-heading"><div><p class="eyebrow">联邦联机 · 第 3 局</p><h2>轮到你落子</h2></div><div class="turn-chip"><span class="mini-stone black"></span><span>黑方</span></div></div>
      <div class="board-stage"><div class="board preview-board" role="img" aria-label="联邦五子棋对局预览"></div></div>
      <p class="board-hint">方向键移动焦点，空格或回车落子</p>
    </section>
    <aside class="side-panel">
      <nav class="mode-tabs"><span class="tab">本地双人</span><span class="tab active">联邦联机</span></nav>
      <section class="panel-section">
        <div class="room-line"><div><span class="label">房间 ID</span><strong>rm_gomoku@echootaku.cn</strong></div><span class="icon-button">⧉</span></div>
        <div class="players">
          <div class="player"><span class="stone black"></span><div><span>黑方</span><strong>@EchoOtaku@echootaku.cn</strong></div><span class="ready-badge ready">已准备</span></div>
          <div class="player"><span class="stone white"></span><div><span>白方</span><strong>@friend@example.com</strong></div><span class="ready-badge ready">已准备</span></div>
        </div>
        <div class="room-actions"><span class="button danger">认输</span><span class="button ghost">离开</span></div>
      </section>
      <section class="panel-section match-info"><div class="section-title"><h2>本地战绩</h2><span>第 3 局</span></div><div class="score"><div><strong>1</strong><span>黑胜</span></div><div><strong>1</strong><span>白胜</span></div><div><strong>0</strong><span>和棋</span></div></div></section>
      <details class="rules"><summary>规则与联机说明</summary></details>
      <p class="notice">状态已与房主同步</p>
    </aside>
  </div>
</main>
