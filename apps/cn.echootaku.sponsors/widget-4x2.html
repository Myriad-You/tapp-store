<section class="sponsor-widget" data-widget-root data-size="4x2" data-theme="light" aria-label="赞助者名单">
  <div class="atlas-main">
    <header class="atlas-heading atlas-heading-inline">
      <strong data-i18n="widgetTitle">赞助者名单</strong>
      <span data-i18n="widgetSubtitle">天文台观测日志</span>
    </header>
    <div class="atlas-chart atlas-chart-wide">
      <canvas data-starfield aria-hidden="true"></canvas>
    </div>
  </div>
  <aside class="atlas-summary">
    <div class="atlas-stat atlas-stat-count">
      <strong data-supporter-count>0</strong>
      <span data-i18n="widgetSupporters">位支持者</span>
    </div>
    <div class="atlas-stat">
      <span class="atlas-kicker" data-i18n="widgetMonthly">本月支持</span>
      <strong data-monthly-amount>—</strong>
    </div>
    <div class="atlas-stat atlas-focus">
      <span class="atlas-kicker" data-i18n="widgetRepresentative">代表星体</span>
      <strong data-brightest-name>—</strong>
      <small><span data-i18n="widgetLifetime">平台累计</span> <b data-brightest-amount>—</b></small>
    </div>
    <footer class="atlas-updated" data-updated-at data-i18n="neverSynced">尚未同步</footer>
  </aside>
</section>
