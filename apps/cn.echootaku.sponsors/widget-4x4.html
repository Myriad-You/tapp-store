<section class="sponsor-widget" data-widget-root data-size="4x4" data-theme="light" aria-label="赞助者名单">

    <span>
      <strong data-i18n="widgetTitle">赞助者名单</strong>
      <small data-i18n="widgetSubtitle">天文台观测日志</small>
    </span>
    <span class="atlas-catalog-number">OBS · <b data-supporter-count>0</b></span>
  </header>
  <div class="atlas-body">
    <div class="atlas-chart atlas-chart-large">
      <canvas data-starfield aria-hidden="true"></canvas>
    </div>
    <aside class="atlas-ledger">
      <section class="atlas-ledger-section atlas-focus">
        <span class="atlas-kicker" data-i18n="widgetRepresentative">代表星体</span>
        <strong data-brightest-name>—</strong>
        <small><span data-i18n="widgetLifetime">平台累计</span> <b data-brightest-amount>—</b></small>
        <span class="atlas-coordinate" data-coordinate>RA — · DEC —</span>
      </section>
      <section class="atlas-ledger-section atlas-statistics">
        <div><span data-i18n="widgetSupporterTotal">赞助者总数</span><strong><b data-supporter-count>0</b></strong></div>
        <div><span data-i18n="widgetMonthly">本月支持</span><strong data-monthly-amount>—</strong></div>
      </section>
      <footer class="atlas-updated" data-updated-at data-i18n="neverSynced">尚未同步</footer>
    </aside>
  </div>
</section>
