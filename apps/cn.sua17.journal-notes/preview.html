<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手账笔记 · Journal Notes</title>
  </head>
  <body>
    <div class="pv-stage">
      <header class="pv-head">
        <span class="pv-logo">📖</span>
        <div class="pv-headings">
          <h1>手账笔记 <span class="pv-sub">Journal Notes</span></h1>
          <p>Myriad 主页小组件 · headless 后台同步 · 缩略图墙 · 2×2 / 4×2 / 4×4</p>
        </div>
      </header>

      <div class="pv-row">
        <figure class="pv-cell">
          <div class="jn-root jn-2x2 jn-theme-dark" data-widget-root="true">
            <header class="jn-head">
              <span class="jn-icon">📖</span>
              <span class="jn-title">手账笔记</span>
              <span class="jn-head-spacer"></span>
              <span class="jn-count">12 篇</span>
            </header>
            <main class="jn-body">
              <article class="jn-note jn-lead-card jn-unread">
                <div class="jn-lead-row">
                  <div class="jn-lead-main">
                    <h3 class="jn-lead-title">立秋后的第一杯冷萃</h3>
                    <p class="jn-lead-summary">今天把书桌重新整理了一遍，顺手记下最近在读的三本书和一点零碎想法。</p>
                    <div class="jn-lead-meta">手账 · 10-02 · ★</div>
                  </div>
                  <div class="jn-thumb jn-thumb-md" style="--jn-hue: 26" aria-hidden="true">
                    <span class="jn-thumb-letter">立</span>
                  </div>
                </div>
              </article>
              <div class="jn-divider"></div>
              <article class="jn-note jn-mini jn-unread">
                <span class="jn-mini-title">周末徒步路线清单</span>
                <span class="jn-mini-date">09-30</span>
              </article>
            </main>
            <footer class="jn-foot">12 篇 · 点击展开</footer>
          </div>
          <figcaption>2×2 · 双条速览</figcaption>
        </figure>

        <figure class="pv-cell">
          <div class="jn-root jn-4x2 jn-theme-dark" data-widget-root="true">
            <header class="jn-head">
              <span class="jn-icon">📖</span>
              <span class="jn-title">手账笔记</span>
              <span class="jn-head-spacer"></span>
              <span class="jn-count">12 篇</span>
            </header>
            <main class="jn-body">
              <div class="jn-split">
                <div class="jn-left">
                  <article class="jn-note jn-lead-card jn-lead-cover jn-unread">
                    <div class="jn-thumb jn-thumb-hero" style="--jn-hue: 158" aria-hidden="true">
                      <span class="jn-thumb-letter">冷</span>
                    </div>
                    <div class="jn-lead-main">
                      <h3 class="jn-lead-title">立秋后的第一杯冷萃</h3>
                      <p class="jn-lead-summary">书桌重新整理了一遍，记下最近在读的三本书。咖啡豆换成浅烘，冷萃泡一夜刚好。</p>
                      <div class="jn-lead-meta">手账 · 10-02 · ★</div>
                    </div>
                  </article>
                </div>
                <div class="jn-side">
                  <article class="jn-note jn-unread">
                    <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 210" aria-hidden="true">
                      <span class="jn-thumb-letter">徒</span>
                    </div>
                    <div class="jn-side-main">
                      <span class="jn-side-title">周末徒步路线清单</span>
                      <span class="jn-side-date">09-30</span>
                    </div>
                  </article>
                  <article class="jn-note">
                    <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 282" aria-hidden="true">
                      <span class="jn-thumb-letter">书</span>
                    </div>
                    <div class="jn-side-main">
                      <span class="jn-side-title">十月读书计划</span>
                      <span class="jn-side-date">09-28</span>
                    </div>
                  </article>
                  <article class="jn-note">
                    <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 4" aria-hidden="true">
                      <span class="jn-thumb-letter">信</span>
                    </div>
                    <div class="jn-side-main">
                      <span class="jn-side-title">给明年自己的信</span>
                      <span class="jn-side-date">09-21</span>
                    </div>
                  </article>
                </div>
              </div>
            </main>
          </div>
          <figcaption>4×2 · 封面 + 分区</figcaption>
        </figure>

        <figure class="pv-cell">
          <div class="jn-root jn-4x4 jn-theme-dark" data-widget-root="true">
            <header class="jn-head">
              <span class="jn-icon">📖</span>
              <span class="jn-title">手账笔记</span>
              <span class="jn-head-spacer"></span>
              <span class="jn-count">12 篇</span>
            </header>
            <main class="jn-body">
              <div class="jn-list">
                <article class="jn-note jn-unread">
                  <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 26" aria-hidden="true">
                    <span class="jn-thumb-letter">立</span>
                    <span class="jn-star">★</span>
                  </div>
                  <div class="jn-row-main">
                    <div class="jn-row-title"><span class="jn-dot"></span><span class="jn-row-text">立秋后的第一杯冷萃</span></div>
                    <div class="jn-row-summary">今天把书桌重新整理了一遍，顺手记下最近在读的三本书。</div>
                  </div>
                  <span class="jn-chip"><b class="jn-chip-m">10</b><i class="jn-chip-d">02</i></span>
                </article>
                <article class="jn-note jn-unread">
                  <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 210" aria-hidden="true">
                    <span class="jn-thumb-letter">徒</span>
                  </div>
                  <div class="jn-row-main">
                    <div class="jn-row-title"><span class="jn-dot"></span><span class="jn-row-text">周末徒步路线清单</span></div>
                    <div class="jn-row-summary">西山环线 12 公里，补给点和备选路线都记一下。</div>
                  </div>
                  <span class="jn-chip"><b class="jn-chip-m">09</b><i class="jn-chip-d">30</i></span>
                </article>
                <article class="jn-note">
                  <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 282" aria-hidden="true">
                    <span class="jn-thumb-letter">书</span>
                  </div>
                  <div class="jn-row-main">
                    <div class="jn-row-title"><span class="jn-row-text">十月读书计划</span></div>
                    <div class="jn-row-summary">两本非虚构、一本小说，睡前各读二十页。</div>
                  </div>
                  <span class="jn-chip"><b class="jn-chip-m">09</b><i class="jn-chip-d">28</i></span>
                </article>
                <article class="jn-note">
                  <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 4" aria-hidden="true">
                    <span class="jn-thumb-letter">信</span>
                  </div>
                  <div class="jn-row-main">
                    <div class="jn-row-title"><span class="jn-row-text">给明年自己的信</span></div>
                    <div class="jn-row-summary">先写下来：少熬夜，多散步，把想做的事分成小块。</div>
                  </div>
                  <span class="jn-chip"><b class="jn-chip-m">09</b><i class="jn-chip-d">21</i></span>
                </article>
                <article class="jn-note">
                  <div class="jn-thumb jn-thumb-sm" style="--jn-hue: 120" aria-hidden="true">
                    <span class="jn-thumb-letter">植</span>
                  </div>
                  <div class="jn-row-main">
                    <div class="jn-row-title"><span class="jn-row-text">阳台植物养护记录</span></div>
                    <div class="jn-row-summary">薄荷换盆成功，龟背竹新叶展开中。</div>
                  </div>
                  <span class="jn-chip"><b class="jn-chip-m">09</b><i class="jn-chip-d">18</i></span>
                </article>
              </div>
            </main>
            <footer class="jn-foot">12 篇 · 点击展开</footer>
          </div>
          <figcaption>4×4 · 缩略图笔记墙</figcaption>
        </figure>
      </div>

      <footer class="pv-foot">
        <span>headless 后台同步 · 同源缩略图 + 渐变占位 · 点击条目展开全文</span>
        <span>zh-CN / en-US / ja-JP</span>
      </footer>
    </div>
  </body>
</html>
