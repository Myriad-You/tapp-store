<main class="shell public" id="public-ui" hidden><section class="panel"><h1>搜索收录由管理员维护</h1><p>URL 推送凭证和记录仅管理员可访问。</p></section></main>
<main class="shell" id="admin-ui" hidden><header><div><p class="eyebrow">SEARCH INDEXING</p><h1>搜索引擎收录提交</h1><p>向百度或 IndexNow 主动提交站点 URL；提交不代表一定收录。</p></div><b id="provider-badge">百度主动推送</b></header><section class="grid"><article class="panel"><h2>01 服务商配置</h2><label>提交服务<select id="provider"><option value="baidu">百度主动推送</option><option value="indexnow">IndexNow</option></select></label><label>站点地址<input id="site-url" type="url" placeholder="https://example.com" autocomplete="url" spellcheck="false"></label><div id="baidu-fields"><label>百度推送 Token<input id="baidu-token" type="password" autocomplete="off" spellcheck="false"></label><button class="guide-link" type="button" data-guide-id="baidu-token" data-guide-url="https://ziyuan.baidu.com/linksubmit/index">打开百度 Token 获取页面</button></div><div id="indexnow-fields" hidden><label>IndexNow Key<input id="indexnow-key" type="password" placeholder="8–128 位字母、数字或连字符" autocomplete="off" spellcheck="false"></label><label>Key 文件地址（可选）<input id="key-location" type="url" autocomplete="url" spellcheck="false"></label><button class="guide-link" type="button" data-guide-id="indexnow-key" data-guide-url="https://www.indexnow.org/faq#how-do-i-generate-an-indexnow-api-key">打开 IndexNow Key 指南</button></div><div class="actions"><button id="save-btn" class="primary">保存配置</button><button id="clear-config-btn">清除配置</button></div><small id="save-status">凭证保存在当前管理员的私有存储</small></article><article class="panel"><h2>02 提交 URL</h2><label>完整 URL（每行一个）<textarea id="urls" rows="12" placeholder="https://example.com/" spellcheck="false"></textarea></label><div class="actions"><button id="add-home-btn">添加首页</button><button id="dedupe-btn">清洗并去重</button><button id="clear-urls-btn">清空</button><button id="submit-btn" class="primary">提交这些 URL</button></div><small id="last-result">百度最多 2,000 条；IndexNow 最多 10,000 条。</small></article></section><section class="panel logs"><h2>03 提交日志</h2><button id="clear-logs-btn">清空日志</button><div id="logs"></div></section></main>
