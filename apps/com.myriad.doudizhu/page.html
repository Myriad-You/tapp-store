<div id="tapp-background" data-phase="loading" aria-hidden="true">
  <div class="page-background menu-background"></div>
  <div class="page-background game-background"></div>
</div>

<div id="tapp-content">
<main id="ddz-app" class="ddz-app" data-phase="loading">
  <section id="menu-screen" class="screen menu-screen">
    <div class="hero-card">
      <p class="eyebrow" data-i18n="menu.eyebrow"></p>
      <h1><span data-i18n="menu.titleLine1"></span><br><span data-i18n="menu.titleLine2"></span></h1>
      <p class="hero-copy" data-i18n="menu.description"></p>
      <div class="difficulty" role="group" data-i18n-aria-label="menu.difficultyLabel">
        <button type="button" data-difficulty="easy" data-i18n="difficulty.easy"></button>
        <button type="button" data-difficulty="normal" class="active" data-i18n="difficulty.normal"></button>
        <button type="button" data-difficulty="hard" data-i18n="difficulty.hard"></button>
      </div>
      <div class="theme-choice-row">
        <span data-i18n="theme.label"></span>
        <div class="theme-choice" role="group" data-i18n-aria-label="theme.label">
          <button type="button" class="active" data-theme-choice="classic" data-i18n="theme.classic"></button>
          <button type="button" data-theme-choice="iroha" data-i18n="theme.iroha"></button>
        </div>
      </div>
      <div class="hero-actions">
        <button type="button" class="primary" data-action="new-game" data-i18n="action.newGame"></button>
        <button type="button" class="secondary" data-action="resume" data-i18n="action.resume" hidden></button>
        <button type="button" class="secondary" data-action="rules" data-i18n="action.rules"></button>
        <button type="button" class="secondary" data-action="preferences" data-i18n="action.preferences"></button>
      </div>
    </div>
    <aside class="menu-side">
      <div class="mini-table" aria-hidden="true"><i></i><i></i><i></i><span>♠</span></div>
      <div class="stat-grid">
        <div><span id="menu-wins">0</span><small data-i18n="stats.wins"></small></div>
        <div><span id="menu-rate">—</span><small data-i18n="stats.winRate"></small></div>
        <div><span id="menu-score">0</span><small data-i18n="stats.score"></small></div>
      </div>
      <button type="button" class="text-action" data-action="history" data-i18n="action.history"></button>
    </aside>
  </section>

  <section id="game-screen" class="screen game-screen" hidden>
    <div class="table-hud">
      <div class="hud-scores">
        <span><i data-i18n="hud.base"></i> <strong id="base-score">1</strong></span>
        <span><i data-i18n="hud.multiplier"></i> <strong id="multiplier">×1</strong></span>
        <span><i data-i18n="hud.bombs"></i> <strong id="bomb-count">0</strong></span>
      </div>
      <div class="hud-actions">
        <button type="button" data-action="home" data-i18n="action.home"></button>
        <button type="button" data-action="rules" data-i18n="action.rulesShort"></button>
        <button type="button" data-action="pause" data-i18n="action.pause"></button>
      </div>
    </div>

    <div class="felt-table">
      <div class="orientation-tip" role="status" data-i18n="game.rotate"></div>
      <div class="viewport-warning" role="status" data-i18n="game.viewportSmall"></div>
      <div id="bottom-cards" class="bottom-cards"><span data-i18n="game.bottomCards"></span><div class="mini-hand"></div></div>
      <section id="player-right" class="seat seat-right"></section>
      <section id="player-left" class="seat seat-left"></section>
      <section id="player-human" class="seat seat-human"></section>
      <div id="turn-banner" class="turn-banner" role="status" aria-live="polite" aria-atomic="true"><strong data-i18n="game.ready"></strong><span></span><b id="countdown" aria-hidden="true">20</b></div>
      <span id="countdown-announcement" class="visually-hidden" aria-live="polite"></span>
      <div id="table-play" class="table-play"></div>
      <div id="action-bar" class="action-bar"></div>
      <div id="human-hand" class="human-hand" data-i18n-aria-label="game.yourHand"></div>
    </div>
  </section>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</main>
</div>
