<section class="daily-widget" data-widget-root data-size="4x2" data-theme="light" data-mood="empty" aria-label="今日斗地主战绩">
  <header class="widget-head">
    <span class="user-avatar">
      <span data-user-initial>我</span>
      <img data-user-avatar alt="" hidden>
    </span>
    <span class="user-copy"><strong data-user-name>我</strong><small data-i18n="widget.title">今日斗地主</small></span>
    <span class="brand-mark" aria-hidden="true">♠</span>
  </header>
  <div class="widget-body">
    <div class="record-block">
      <small data-i18n="widget.record">今日胜负</small>
      <strong data-record>0 - 0</strong>
    </div>
    <strong class="mood-display" data-mood-label>—</strong>
    <footer class="widget-stats">
      <span><small data-i18n="widget.games">对局</small><strong data-games>0</strong></span>
      <span><small data-i18n="widget.winRate">胜率</small><strong data-win-rate>—</strong></span>
      <span><small data-i18n="widget.netScore">净积分</small><strong data-score>0</strong></span>
    </footer>
    <figure class="result-art" aria-hidden="true">
      <span class="empty-mark">♠</span>
      <img data-result-art alt="" hidden>
    </figure>
  </div>
</section>
