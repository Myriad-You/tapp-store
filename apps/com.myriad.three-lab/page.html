<div id="tapp-background">
  <div class="lab-bg"></div>
  <div class="lab-glow lab-glow-1"></div>
  <div class="lab-glow lab-glow-2"></div>
</div>

<div id="tapp-content">
  <main class="lab-page">
    <header class="lab-header">
      <div class="lab-copy">
        <p class="lab-kicker" data-i18n="kicker">官方示例</p>
        <h1 id="lab-title" data-i18n="title">Three 实验室</h1>
        <p id="lab-subtitle" class="lab-subtitle" data-i18n="subtitle">
          包内贴图与 GLB。没有 CDN。离开页面会暂停渲染。
        </p>
      </div>
      <div class="lab-actions">
        <button type="button" id="lab-spin" data-i18n="spin">暂停旋转</button>
        <button type="button" id="lab-fullscreen" data-i18n="fullscreen">全屏</button>
      </div>
    </header>
    <section class="lab-stage" aria-label="WebGL">
      <canvas id="lab-canvas"></canvas>
      <p id="lab-status" class="lab-status" role="status"></p>
    </section>
  </main>
</div>
