<div class="gtw gtw-endgame gtw-size-4x4" data-widget-root="true">
  <div class="gtw-tabs" role="tablist">
    <button class="gtw-tab is-active" type="button" data-gt-w-tab="moc" data-gt-w-tab-moc></button>
    <button class="gtw-tab" type="button" data-gt-w-tab="fiction" data-gt-w-tab-fiction></button>
    <button class="gtw-tab" type="button" data-gt-w-tab="apocalyptic" data-gt-w-tab-apocalyptic></button>
  </div>
  <div class="gtw-abyss-panel" data-gt-w-panel="moc">
    <div class="gtw-abyss-col">
      <p class="gtw-abyss-big"><strong data-gt-w-moc-stars>--</strong><span data-gt-w-moc-floor></span></p>
      <p class="gtw-abyss-sub" data-gt-w-moc-sub></p>
      <div class="gtw-floor-rows gtw-floor-rows--grid" data-gt-w-floors-moc></div>
    </div>
  </div>
  <div class="gtw-abyss-panel" data-gt-w-panel="fiction" hidden>
    <div class="gtw-abyss-col">
      <p class="gtw-abyss-big"><strong data-gt-w-fiction-stars>--</strong><span data-gt-w-fiction-floor></span></p>
      <p class="gtw-abyss-sub" data-gt-w-fiction-sub></p>
      <div class="gtw-floor-rows gtw-floor-rows--grid" data-gt-w-floors-fiction></div>
    </div>
  </div>
  <div class="gtw-abyss-panel" data-gt-w-panel="apocalyptic" hidden>
    <div class="gtw-abyss-col">
      <p class="gtw-abyss-big"><strong data-gt-w-apocalyptic-stars>--</strong><span data-gt-w-apocalyptic-floor></span></p>
      <p class="gtw-abyss-sub" data-gt-w-apocalyptic-sub></p>
      <div class="gtw-floor-rows gtw-floor-rows--grid" data-gt-w-floors-apocalyptic></div>
    </div>
  </div>
  <p class="gt-empty" data-gt-w-empty hidden></p>
</div>
