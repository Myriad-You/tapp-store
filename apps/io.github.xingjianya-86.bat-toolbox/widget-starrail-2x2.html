<div class="gtw gtw-starrail gtw-size-2x2" data-widget-root="true">
  <div class="gtw-head">
    <div class="gt-avatar-wrap">
      <img class="gt-avatar" data-gt-w-avatar alt="" hidden />
      <span class="gt-avatar-fallback" data-gt-w-avatar-fallback>★</span>
    </div>
    <div class="gtw-head-text">
      <p class="gtw-name" data-gt-w-name></p>
      <p class="gtw-level" data-gt-w-level></p>
    </div>
  </div>
  <div class="gtw-stats gtw-stats--rows">
    <span class="gt-pill gt-pill-stamina"><span aria-hidden="true">⚡</span><strong data-gt-w-stamina>--</strong></span>
    <span class="gt-pill gt-pill-train"><span aria-hidden="true">📋</span><strong data-gt-w-train>--</strong></span>
    <span class="gt-pill gt-pill-expedition"><span aria-hidden="true">🛰️</span><strong data-gt-w-expedition>--</strong></span>
  </div>
  <p class="gt-empty" data-gt-w-empty hidden></p>
</div>
