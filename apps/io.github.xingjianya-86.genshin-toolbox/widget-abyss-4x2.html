<div class="gtw gtw-abyss gtw-size-4x2" data-widget-root="true">
  <div class="gtw-tabs" role="tablist">
    <button class="gtw-tab is-active" type="button" data-gt-w-tab="spiral" data-gt-w-tab-spiral></button>
    <button class="gtw-tab" type="button" data-gt-w-tab="poetry" data-gt-w-tab-poetry></button>
  </div>
  <div class="gtw-abyss-panel" data-gt-w-panel="spiral">
    <div class="gtw-abyss-col">
      <p class="gtw-abyss-big"><strong data-gt-w-spiral-stars>--</strong><span data-gt-w-spiral-floor></span></p>
      <p class="gtw-abyss-sub" data-gt-w-spiral-prev></p>
      <div class="gtw-floor-rows" data-gt-w-floors></div>
    </div>
  </div>
  <div class="gtw-abyss-panel" data-gt-w-panel="poetry" hidden>
    <div class="gtw-abyss-col">
      <p class="gtw-abyss-big"><strong data-gt-w-poetry-medals>--</strong><span data-gt-w-poetry-label></span></p>
      <p class="gtw-abyss-sub" data-gt-w-poetry-sub></p>
    </div>
  </div>
  <p class="gt-empty" data-gt-w-empty hidden></p>
</div>
