<div class="gtw gtw-genshin gtw-size-4x2" data-widget-root="true">
  <div class="gtw-head">
    <div class="gt-avatar-wrap">
      <img class="gt-avatar" data-gt-w-avatar alt="" hidden />
      <span class="gt-avatar-fallback" data-gt-w-avatar-fallback>★</span>
      <img class="gt-avatar-bbs" data-gt-w-bbs alt="" hidden />
    </div>
    <div class="gtw-head-text">
      <p class="gtw-name" data-gt-w-name></p>
      <p class="gtw-level" data-gt-w-level></p>
    </div>
    <div class="gtw-stats">
      <span class="gt-pill gt-pill-resin"><span aria-hidden="true">🌙</span><strong data-gt-w-resin>--</strong></span>
      <span class="gt-pill gt-pill-task"><span aria-hidden="true">📜</span><strong data-gt-w-task>--</strong></span>
      <span class="gt-pill gt-pill-coin"><span aria-hidden="true">🪙</span><strong data-gt-w-coin>--</strong></span>
    </div>
  </div>
  <div class="gtw-chars gtw-chars--scroll" data-gt-w-chars></div>
  <p class="gt-empty" data-gt-w-empty hidden></p>
</div>
